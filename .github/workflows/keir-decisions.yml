name: Keir decision contract
on:
  pull_request:
    paths:
      - 'src/utils/keirDecision.ts'
      - 'tests/keirDecision.test.ts'
      - '.github/workflows/keir-decisions.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/keirDecision.test.ts
